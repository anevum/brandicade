name: Verify recovered static source
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/logic.test.mjs tests/access-jwt.test.mjs tests/save-boundary.test.mjs tests/d1-save-adapter.test.mjs
      - run: python3 -m unittest discover -s tests -p test_static_build.py -v
      - run: python3 build_worker.py
      - run: python3 -m py_compile build_worker.py
# Verification only: the recovered static bundle must not overwrite production.
